supercitadel.62.146.238.213.sslip.io {
  handle /api/* {
    reverse_proxy 127.0.0.1:3001
  }
  handle /ws* {
    reverse_proxy 127.0.0.1:3002
  }
  # Immutable Next.js build assets — safe to cache long (hashed filenames)
  @nextstatic path /_next/static/*
  handle @nextstatic {
    reverse_proxy 127.0.0.1:3000
    header Cache-Control "public, max-age=31536000, immutable"
  }
  # Everything else (HTML documents, RSC) — NEVER long-cache so new deploys are picked up immediately.
  # Fixes deploy-time "white screen / can't access": stale HTML must not pin old chunk hashes.
  handle {
    reverse_proxy 127.0.0.1:3000
    header >Cache-Control "no-cache, must-revalidate"
  }
  header {
    X-Content-Type-Options nosniff
    X-Frame-Options SAMEORIGIN
    Referrer-Policy strict-origin-when-cross-origin
    Strict-Transport-Security "max-age=63072000; includeSubDomains"
    -Server
  }
}
