services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${DB_USER:-citadellab}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-citadellab_dev}
      POSTGRES_DB: ${DB_NAME:-citadellab}
    volumes:
      - pgdata_lab:/var/lib/postgresql/data
    ports: ["127.0.0.1:5452:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-citadellab}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6402:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: { context: ., dockerfile: services/api/Dockerfile }
    environment:
      DATABASE_URL: postgresql://${DB_USER:-citadellab}:${DB_PASSWORD:-citadellab_dev}@postgres:5432/${DB_NAME:-citadellab}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-lab_secret_change_me}
      LLM_MODE: ${LLM_MODE:-stub}
      BETA_MODE: ${BETA_MODE:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-cc/claude-sonnet-4-6}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM2_BASE_URL: ${LLM2_BASE_URL:-}
      LLM2_MODEL: ${LLM2_MODEL:-cx/gpt-5.5}
      LLM2_API_KEY: ${LLM2_API_KEY:-}
      NODE_ENV: ${NODE_ENV:-development}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      PORT: 3001
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["127.0.0.1:3011:3001"]

  ws:
    build: { context: ., dockerfile: services/ws/Dockerfile }
    environment:
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-lab_secret_change_me}
      PORT: 3002
    depends_on:
      redis: { condition: service_healthy }
    ports: ["127.0.0.1:3012:3002"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3011}
        NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL:-ws://localhost:3012}
        NEXT_PUBLIC_DEMO_TOKEN: ${DEMO_TOKEN:-}
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3011}
      NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL:-ws://localhost:3012}
      NEXT_PUBLIC_DEMO_TOKEN: ${DEMO_TOKEN:-}
    depends_on: [api, ws]
    ports: ["127.0.0.1:3010:3000"]

volumes:
  pgdata_lab:
