# SUPERCITADELLAB — host riêng sandbox trên VPS
# Public qua host Caddy: https://supercitadellab.62.146.238.213.sslip.io
#   /api/* → 127.0.0.1:3011 · /ws* → 127.0.0.1:3012 · / → 127.0.0.1:3010
# Ports tách biệt hoàn toàn bản gốc (3000/3001/3002/5442/6392).
services:
  postgres:
    ports: !override ["127.0.0.1:5452:5432"]
  redis:
    ports: !override ["127.0.0.1:6402:6379"]
  api:
    ports: !override ["127.0.0.1:3011:3001"]
  ws:
    ports: !override ["127.0.0.1:3012:3002"]
  web:
    ports: !override ["127.0.0.1:3010:3000"]
