# NewCitadelV21 — fully isolated host (anh Nấng)
services:
  postgres:
    ports: !override ["127.0.0.1:5441:5432"]
  redis:
    ports: !override ["127.0.0.1:6391:6379"]
  api:
    environment:
      PUBLIC_API_URL: http://newcitadelv21.62.146.238.213.nip.io:8094
    ports: !override ["3021:3001"]
  ws:
    ports: !override ["3022:3002"]
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://newcitadelv21.62.146.238.213.nip.io:8094
        NEXT_PUBLIC_WS_URL: ws://newcitadelv21.62.146.238.213.nip.io:8095
    environment:
      NEXT_PUBLIC_API_URL: http://newcitadelv21.62.146.238.213.nip.io:8094
      NEXT_PUBLIC_WS_URL: ws://newcitadelv21.62.146.238.213.nip.io:8095
    ports: !override ["3020:3000"]
  caddy:
    image: caddy:2-alpine
    container_name: newcitadelv21-caddy
    restart: unless-stopped
    depends_on: [web, api, ws]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "8093:80"
      - "8094:81"
      - "8095:82"
